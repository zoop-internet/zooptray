name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm ci

      - name: Create frontend dist directory
        run: |
          mkdir -p frontend/dist && touch frontend/dist/placeholder.txt

      - name: Generate Wails module bindings
        run: |
          wails generate module

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Build macOS universal binary
        run: |
          wails build -platform darwin/universal -clean

      - name: Package .app bundle
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent build/bin/zoop-one.app release/zoop-one-macos-${{ github.ref_name }}.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoop-one-macos
          path: release/zoop-one-macos-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release/zoop-one-macos-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
