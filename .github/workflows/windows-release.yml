name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm ci

      - name: Create frontend dist directory
        shell: bash
        run: |
          mkdir -p frontend/dist && touch frontend/dist/placeholder.txt

      - name: Generate Wails module bindings
        run: |
          wails generate module

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Install NSIS
        run: |
          choco install nsis.portable --no-progress

      - name: Build Windows binary
        run: |
          wails build -platform windows/amd64 -clean
        shell: bash

      - name: Stage NSIS installer files
        shell: bash
        run: |
          mkdir -p windows_installer/staging
          cp build/bin/zoop-one.exe windows_installer/staging/
          cp windows_installer/config_installer.json windows_installer/staging/config.json
          ls -la windows_installer/staging/

      - name: Build NSIS installer
        shell: bash
        run: |
          echo "=== CWD ==="
          pwd
          echo "=== Staging from CWD ==="
          ls -la windows_installer/staging/
          cd windows_installer
          makensis -DVERSION="${{ github.ref_name }}" zoop_installer.nsi
          echo "=== Built installer ==="
          ls -la *.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoop-one-windows-binary
          path: build/bin/zoop-one.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoop-one-windows-installer
          path: windows_installer/zoop-one-installer-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            build/bin/zoop-one.exe
            windows_installer/zoop-one-installer-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
