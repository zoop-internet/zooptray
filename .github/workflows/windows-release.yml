name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm ci

      - name: Create frontend dist directory
        shell: bash
        run: |
          mkdir -p frontend/dist && touch frontend/dist/placeholder.txt

      - name: Generate Wails module bindings
        run: |
          wails generate module

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Install NSIS
        run: |
          choco install nsis.portable --no-progress

      - name: Build Windows binary
        run: |
          wails build -platform windows/amd64 -clean

      - name: List build output
        shell: bash
        run: |
          echo "=== build/bin contents ==="
          ls -la build/bin/ 2>/dev/null || echo "build/bin/ does not exist"
          echo "=== Recursive build tree ==="
          find build/ -type f 2>/dev/null || echo "build/ does not exist"

      - name: Stage NSIS installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "windows_installer/staging" -Force | Out-Null
          if (-not (Test-Path "build/bin/zoop-one.exe")) { throw "build/bin/zoop-one.exe not found after wails build" }
          Copy-Item "build/bin/zoop-one.exe" "windows_installer/staging/zoop-one.exe" -ErrorAction Stop
          Copy-Item "windows_installer/config_installer.json" "windows_installer/staging/config.json" -ErrorAction Stop
          Write-Host "=== staging contents ==="
          Get-ChildItem "windows_installer/staging/"

      - name: Build NSIS installer
        working-directory: windows_installer
        run: |
          makensis -DVERSION=${{ github.ref_name }} zoop_installer.nsi
        shell: cmd

      - name: Determine installer path
        id: installer
        shell: pwsh
        run: |
          $path = "windows_installer\zoop-one-installer-${{ github.ref_name }}.exe"
          if (-not (Test-Path $path)) {
            $path = "windows_installer\zoop-one-installer-unknown.exe"
          }
          echo "path=$path" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            ${{ steps.installer.outputs.path }}
            build/bin/zoop-one.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
