name: Build Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wails system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm ci

      - name: Create frontend dist directory
        run: |
          mkdir -p frontend/dist && touch frontend/dist/placeholder.txt

      - name: Generate Wails module bindings
        run: |
          wails generate module

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Build Linux binary
        run: |
          wails build -platform linux/amd64 -clean

      - name: Package release
        run: |
          mkdir -p release
          cp build/bin/zoop-one release/zoop-one
          tar czf release/zoop-one-linux-${{ github.ref_name }}.tar.gz -C release zoop-one

      - name: Build .deb package
        run: |
          PKG_NAME="zoop-one"
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DEB_DIR="release/deb/${PKG_NAME}_${VERSION}_amd64"

          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${DEB_DIR}/usr/share/doc/${PKG_NAME}"

          install -m 755 build/bin/zoop-one "${DEB_DIR}/usr/bin/zoop-one"

          { echo 'Package: zoop-one'; echo "Version: ${VERSION}"; echo 'Architecture: amd64'; echo 'Maintainer: Zoop Network <contact@zoopnetwork.com>'; echo 'Description: Zoop One - Community-powered desktop node'; echo ' Run a lightweight system-tray node that manages sharing,'; echo ' peer connections, local controls, and provider network operations.'; echo 'Depends: libgtk-3-0 (>= 3.24), libwebkit2gtk-4.1-0 (>= 2.40)'; } > "${DEB_DIR}/DEBIAN/control"

          { echo '[Desktop Entry]'; echo 'Name=Zoop One'; echo 'Comment=Community-powered desktop node'; echo 'Exec=/usr/bin/zoop-one'; echo 'Terminal=false'; echo 'Type=Application'; echo 'Categories=Network;Utility;'; echo 'Icon=zoop-one'; } > "${DEB_DIR}/usr/share/applications/zoop-one.desktop"

          cp build/appicon.png "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps/zoop-one.png"

          { echo 'Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/'; echo 'Upstream-Name: Zoop One'; echo 'Source: https://github.com/Zoop-Network/zooptray'; } > "${DEB_DIR}/DEBIAN/copyright"

          dpkg-deb --root-owner-group --build "${DEB_DIR}" "release/zoop-one_${VERSION}_amd64.deb"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoop-one-linux-binary
          path: build/bin/zoop-one

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoop-one-linux-archive
          path: release/zoop-one-linux-${{ github.ref_name }}.tar.gz

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoop-one-linux-deb
          path: release/zoop-one_*.deb

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release/zoop-one-linux-${{ github.ref_name }}.tar.gz
            release/zoop-one
            release/zoop-one_*.deb
