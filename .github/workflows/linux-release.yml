name: Build Linux Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wails system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        working-directory: ./frontend
        run: |
          npm ci

      - name: Generate Wails module bindings
        run: |
          wails generate module

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

      - name: Build Linux binary
        run: |
          wails build -platform linux/amd64 -clean

      - name: Package release
        run: |
          mkdir -p release
          cp build/bin/zoop-one release/zoop-one
          tar czf release/zoop-one-linux-${{ github.ref_name }}.tar.gz -C release zoop-one

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            release/zoop-one-linux-${{ github.ref_name }}.tar.gz
            release/zoop-one
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
